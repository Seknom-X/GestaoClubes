name: gestaoclubes
services:
  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_DATABASE: gestaoclubes
      MYSQL_USER: gestaoclubes_app
      MYSQL_PASSWORD: ${CLUBS_DB_PASSWORD:?Execute scripts/Configure.ps1}
      MYSQL_ROOT_PASSWORD: ${CLUBS_ROOT_PASSWORD:?Execute scripts/Configure.ps1}
    ports:
      - "127.0.0.1:33316:3306"
    volumes:
      - clubs_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
volumes:
  clubs_mysql:
